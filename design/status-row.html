<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FR255 Status Row</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;900&family=Roboto+Condensed:wght@700&display=swap">
<style>
  :root { --bg: #101214; --card: #1a1d21; --line: #2c3138; --fg: #e8eaed; --muted: #9aa3ad; --accent: #00AAFF; --bad: #FF0055; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 Roboto, Arial, sans-serif; }
  .page { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
  h1, h2 { font-family: "Roboto Condensed", "Arial Narrow", Arial, sans-serif; margin: 0; }
  h1 { font-size: 28px; }
  h2 { font-size: 19px; }
  .muted { color: var(--muted); }
  .controls { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center;
    margin: 18px 0; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .controls label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .controls output { display: inline-block; min-width: 2.6em; color: var(--accent); font-variant-numeric: tabular-nums; }
  select, input[type=range] { accent-color: var(--accent); }
  select { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card canvas { display: block; max-width: 100%; height: auto; margin: 10px auto; }
  .card canvas.zoom { background: #000; border-radius: 6px; }
  .tag { display: inline-block; margin-right: 8px; padding: 0 7px; border-radius: 5px; background: var(--accent); color: #000;
    font: 700 14px "Roboto Condensed", Arial, sans-serif; }
  .width { font-size: 13px; font-variant-numeric: tabular-nums; }
  .width.over { color: var(--bad); font-weight: 500; }
  .note { font-size: 13.5px; margin: 6px 0 0; }
</style>
</head>
<body>
<div class="page">
  <h1>FR255 Status Row</h1>
  <p class="muted">The battery with the days that remain, and the alarm icon. Each card shows the full face, then the status row at 4 times its size.
    The red lines in the large view show the limits of the free space (146 pixels).</p>

  <div class="controls">
    <label>Battery <input type="range" id="pct" min="0" max="100" value="62"> <output id="pctOut"></output></label>
    <label>Days <input type="range" id="days" min="0" max="20" value="12"> <output id="daysOut"></output></label>
    <label>Alarms <input type="range" id="alarms" min="0" max="3" value="1"> <output id="alarmsOut"></output></label>
    <label>Alarm icon
      <select id="alarmIcon"><option value="bell">Bell</option><option value="clock">Alarm clock</option></select></label>
    <label>Alarm display
      <select id="alarmMode">
        <option value="hide">A1: icon only, hidden with no alarm</option>
        <option value="count">A2: icon and count, hidden with no alarm</option>
        <option value="always">A3: icon always, grey with no alarm</option>
      </select></label>
    <label><input type="checkbox" id="weather" checked> Weather available</label>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
(function () {
  'use strict';
  var C = { bg: '#000000', fg: '#FFFFFF', dim: '#AAAAAA', track: '#555555', accent: '#00AAFF', heart: '#FF0055', stress: '#FFAA00', sun: '#FFFF55' };
  var CAP = 0.711, XT = 16, SMALL = 12, LIMIT = 146;

  var VARIANTS = [
    { id: 'B5', name: 'Small icon and the days that remain',
      note: 'The icon is 22 x 11 pixels with a level bar only. The days are in FONT_XTINY, as the temperature. The bar and the text are red at 20% or less.' }
  ];

  function kit(ctx) {
    var k = {};
    k.font = function (size, family) {
      ctx.font = (family === 'time' ? '900 ' : '700 ') + size + 'px ' +
        (family === 'time' ? 'Roboto, "Arial Black", sans-serif' : '"Roboto Condensed", "Arial Narrow", Arial, sans-serif');
    };
    k.text = function (str, x, y, size, color, align, family) {
      k.font(size, family);
      ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(str, x, y + (size * CAP) / 2);
    };
    k.width = function (str, size, family) { k.font(size, family); return Math.ceil(ctx.measureText(str).width); };
    k.rect = function (x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); };
    k.box = function (x, y, w, h, color) { ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1); };
    k.disc = function (x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); };
    k.line = function (x1, y1, x2, y2, color, w) {
      ctx.strokeStyle = color; ctx.lineWidth = w || 1; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    };

    // The battery. x is the left edge, y is the center.
    k.battery = function (x, y, pct, text) {
      var low = pct <= 20;
      k.box(x, y - 5, 19, 11, C.dim);
      k.rect(x + 19, y - 2, 3, 5, C.dim);
      k.rect(x + 2, y - 3, Math.round((15 * pct) / 100), 7, low ? C.heart : C.fg);
      k.text(text, x + 26, y, XT, low ? C.heart : C.fg);
    };
    k.phone = function (x, y) {
      ctx.strokeStyle = C.accent; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(x - 5, y - 9, 11, 18, 2); ctx.stroke();
      k.rect(x - 1, y + 4, 3, 2, C.accent);
    };
    // The alarm icon. x and y are the center. The icon is 14 pixels wide.
    k.bell = function (x, y, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y - 2, 5, Math.PI, 0);
      ctx.lineTo(x + 5, y + 3); ctx.lineTo(x + 7, y + 5); ctx.lineTo(x - 7, y + 5); ctx.lineTo(x - 5, y + 3);
      ctx.closePath(); ctx.fill();
      k.rect(x - 1, y - 9, 2, 2, color);
      k.disc(x, y + 7, 2, color);
    };
    k.clock = function (x, y, color) {
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y + 1, 6, 0, Math.PI * 2); ctx.stroke();
      k.line(x, y + 1, x, y - 3, color, 1); k.line(x, y + 1, x + 3, y + 1, color, 1);
      k.line(x - 7, y - 5, x - 3, y - 8, color, 2); k.line(x + 7, y - 5, x + 3, y - 8, color, 2);
    };
    k.sun = function (x, y) {
      k.disc(x, y, 4, C.sun);
      [[-8, 0, 9, 0], [0, -8, 0, 9], [-6, -6, 7, 7], [-6, 6, 7, -7]].forEach(function (r) {
        k.line(x + r[0], y + r[1], x + r[2], y + r[3], C.sun, 1);
      });
    };
    k.calendar = function (x, y) {
      k.box(x, y - 6, 16, 14, C.dim); k.rect(x, y - 6, 16, 4, C.dim);
      k.rect(x + 3, y - 9, 2, 4, C.dim); k.rect(x + 11, y - 9, 2, 4, C.dim);
      k.rect(x + 4, y + 1, 3, 3, C.dim); k.rect(x + 9, y + 1, 3, 3, C.dim);
    };

    // The status row, centered on cx. It returns the total width.
    k.statusRow = function (cx, y, v, s) {
      var gap = 8, temp = '18°';
      var daysText = (s.days < 1) ? '<1d' : s.days + 'd';
      var showAlarm = s.alarms > 0 || s.alarmMode === 'always';
      var countText = (s.alarmMode === 'count' && s.alarms > 0) ? String(s.alarms) : null;
      var parts = [];
      parts.push({ w: 26 + k.width(daysText, XT), draw: function (x) { k.battery(x, y, s.pct, daysText); } });
      parts.push({ w: 11, draw: function (x) { k.phone(x + 5, y); } });
      if (showAlarm) {
        parts.push({ w: 14 + (countText ? 3 + k.width(countText, XT) : 0), draw: function (x) {
          var color = (s.alarms > 0) ? C.fg : C.track;
          if (s.alarmIcon === 'clock') { k.clock(x + 7, y, color); } else { k.bell(x + 7, y, color); }
          if (countText) { k.text(countText, x + 17, y, XT, C.fg); }
        } });
      }
      if (s.weather) {
        parts.push({ w: 18 + 5 + k.width(temp, XT), draw: function (x) { k.sun(x + 9, y); k.text(temp, x + 23, y, XT, C.fg); } });
      }
      var total = parts.reduce(function (sum, p) { return sum + p.w; }, 0) + gap * (parts.length - 1);
      var x = Math.round(cx - total / 2);
      parts.forEach(function (p) { p.draw(x); x += p.w + gap; });
      return total;
    };
    return k;
  }

  function drawFace(ctx, v, s) {
    var k = kit(ctx), cx = 130, cy = 130;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, 130, 0, Math.PI * 2); ctx.clip();
    k.rect(0, 0, 260, 260, C.bg);
    [[125, 0.45, C.heart], [117, 0.6, C.accent], [109, 0.3, C.stress]].forEach(function (r) {
      var from = Math.PI * 0.75, full = Math.PI * 1.5;
      ctx.lineWidth = 5; ctx.lineCap = 'butt';
      ctx.strokeStyle = C.track; ctx.beginPath(); ctx.arc(cx, cy, r[0], from, from + full); ctx.stroke();
      ctx.strokeStyle = r[2]; ctx.beginPath(); ctx.arc(cx, cy, r[0], from, from + full * r[1]); ctx.stroke();
    });
    k.text('10', cx - 52, cy - 63, 42, C.fg, 'left', 'time');
    k.text('WED 11 NOV', cx + 2, cy - 72, XT, C.dim);
    k.text('Asr 15:12', cx + 2, cy - 54, XT, C.fg);
    k.text('50', cx, cy + 4, 120, C.accent, 'center', 'time');
    k.calendar(cx - 48, cy + 66);
    k.text('14:30', cx - 26, cy + 66, XT, C.fg);
    k.text('in 25 min', cx + 12, cy + 66, XT, C.dim);
    var total = k.statusRow(cx, cy + 92, v, s);
    ctx.restore();
    return total;
  }

  function drawZoom(ctx, v, s) {
    var k = kit(ctx);
    k.rect(0, 0, 170, 30, C.bg);
    k.line(85 - LIMIT / 2 - 0.5, 0, 85 - LIMIT / 2 - 0.5, 30, C.heart, 1);
    k.line(85 + LIMIT / 2 + 0.5, 0, 85 + LIMIT / 2 + 0.5, 30, C.heart, 1);
    k.statusRow(85, 15, v, s);
  }

  function canvas(w, h, scale, cssWidth, cls) {
    var c = document.createElement('canvas');
    c.width = w * scale; c.height = h * scale; c.style.width = cssWidth + 'px';
    if (cls) { c.className = cls; }
    c.getContext('2d').scale(scale, scale);
    return c;
  }

  var grid = document.getElementById('grid');
  var cards = VARIANTS.map(function (v) {
    var card = document.createElement('div'); card.className = 'card';
    var head = document.createElement('h2');
    var tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = v.id;
    head.appendChild(tag); head.appendChild(document.createTextNode(v.name));
    var face = canvas(260, 260, 3, 260);
    var zoom = canvas(170, 30, 4, 680, 'zoom');
    var width = document.createElement('div'); width.className = 'width';
    var note = document.createElement('p'); note.className = 'note muted'; note.textContent = v.note;
    [head, face, zoom, width, note].forEach(function (el) { card.appendChild(el); });
    grid.appendChild(card);
    return { v: v, face: face.getContext('2d'), zoom: zoom.getContext('2d'), width: width };
  });

  function el(id) { return document.getElementById(id); }
  function state() {
    return { pct: Number(el('pct').value), days: Number(el('days').value), alarms: Number(el('alarms').value), alarmIcon: el('alarmIcon').value,
      alarmMode: el('alarmMode').value, weather: el('weather').checked };
  }
  function render() {
    var s = state();
    el('pctOut').textContent = s.pct + '%';
    el('daysOut').textContent = String(s.days);
    el('alarmsOut').textContent = String(s.alarms);
    cards.forEach(function (c) {
      var total = drawFace(c.face, c.v, s);
      drawZoom(c.zoom, c.v, s);
      c.width.textContent = 'Row width: ' + total + ' of ' + LIMIT + ' pixels' + (total > LIMIT ? '. Too wide.' : '');
      c.width.className = 'width' + (total > LIMIT ? ' over' : '');
    });
  }
  ['pct', 'days', 'alarms', 'alarmIcon', 'alarmMode', 'weather'].forEach(function (id) { el(id).addEventListener('input', render); });
  render();
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(render); }
}());
</script>
</body>
</html>
